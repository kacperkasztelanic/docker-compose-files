services:
  runner:
    image: docker.io/gitea/act_runner:latest
    container_name: gitea-act
    restart: unless-stopped
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: "https://git.myszu.ovh"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${GITEA_REGISTRATION_TOKEN}"
      GITEA_RUNNER_NAME: "tpad"
    volumes:
      -  /home/kacper/Dev/docker-volumes/gitea-act/config.yaml:/config.yaml
      -  /home/kacper/Dev/docker-volumes/gitea-act/data:/data
      - /var/run/docker.sock:/var/run/docker.sock